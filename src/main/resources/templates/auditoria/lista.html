<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Auditoria</title></head>
<body>
<div th:fragment="content">
    <h2 class="fw-bold mb-1"><i class="bi bi-shield-check me-2 text-primary"></i>Auditoria</h2>
    <p class="text-muted">Somente consulta (ADMIN e GERENTE). Sem edição/exclusão. Senhas e tokens nunca aparecem.</p>
    <div class="card shadow-sm"><div class="card-body p-0">
        <table class="table table-hover align-middle mb-0 small">
            <thead class="table-dark"><tr><th>Data/Hora</th><th>Usuário</th><th>Perfil</th><th>Operação</th><th>Entidade</th><th>ID</th><th>Campos</th><th>Anterior → Novo</th><th>Justificativa</th></tr></thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(registros)}"><td colspan="9" class="text-center text-muted py-4">Sem registros.</td></tr>
                <tr th:each="r : ${registros}">
                    <td th:text="${r.dataHora}"></td><td th:text="${r.usuario}"></td><td th:text="${r.perfil}"></td>
                    <td th:text="${r.operacao}"></td><td th:text="${r.entidade}"></td><td th:text="${r.entidadeId}"></td>
                    <td th:text="${r.camposAlterados}"></td><td th:text="${r.valorAnterior + ' → ' + r.valorNovo}"></td>
                    <td th:text="${r.justificativa}"></td>
                </tr>
            </tbody>
        </table>
    </div></div>
</div>
</body>
</html>
