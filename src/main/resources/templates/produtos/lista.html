<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Gerenciar Produtos</title></head>
<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-boxes me-2 text-primary"></i>Gestão de Produtos</h2>
        <div sec:authorize="hasRole('ADMIN')">
            <button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#formularioProduto">
                <i class="bi bi-plus-lg me-1"></i>Novo Produto
            </button>
        </div>
    </div>

    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <span th:text="${sucesso}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <span th:text="${erro}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>


    <div sec:authorize="hasRole('ADMIN')">
        <div class="collapse mb-3" id="formularioProduto">
            <div class="card card-body">
                <form th:action="@{/produtos/salvar}" method="post" id="produtoForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome do Produto</label>
                        <input type="text" id="nome" name="nome" class="form-control" placeholder="Nome do Produto" required>
                    </div>
                    <div class="mb-3">
                        <label for="tipo" class="form-label">Tipo do Produto</label>
                        <select id="tipo" name="tipo" class="form-select" required>
                            <option value="" disabled selected>Selecione o Tipo</option>
                            <option value="Pizza">Pizza</option>
                            <option value="Lanche">Lanche</option>
                            <option value="Bebida">Bebida</option>
                            <option value="Porção">Porção</option>
                            <option value="Adicional">Adicional</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="preco" class="form-label">Preço</label>
                        <input type="number" id="preco" name="preco" class="form-control" placeholder="Preço (R$)" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" id="ativo" name="ativo" class="form-check-input" checked>
                        <label for="ativo" class="form-check-label">Produto Ativo</label>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-success">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-bordered table-striped mt-0 mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th sec:authorize="hasRole('ADMIN')">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="6" class="text-center text-muted py-4">Nenhum produto cadastrado.</td>
                    </tr>
                    <tr th:each="produto : ${produtos}">
                        <td class="ps-4 text-muted" th:text="${produto.id}"></td>
                        <td th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td th:text="${produto.preco != null ? 'R$ ' + produto.preco : '—'}"></td>
                        <td th:text="${produto.ativo ? 'Sim' : 'Não'}">Sim</td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <form th:action="@{/produtos/excluir/{id}(id=${produto.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-danger btn-sm"
                                   onclick="return confirm('Tem certeza que deseja excluir este produto?');">
                                    Excluir
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
