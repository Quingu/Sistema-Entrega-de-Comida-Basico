<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Novo pedido</title></head>
<body>
<div th:fragment="content">
    <a href="/pedidos" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> Voltar</a>
    <h2 class="fw-bold mb-3">Novo pedido</h2>
    <p class="text-muted">Preço capturado do cadastro de produtos no servidor. Total <strong>não</strong> vem do navegador.</p>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <div class="card shadow-sm" style="max-width:720px"><div class="card-body p-4">
        <form th:action="@{/pedidos/novo}" method="post" id="pedidoForm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label fw-medium">Cliente</label>
                <select class="form-select" name="clienteId" required>
                    <option value="" disabled selected>Selecione</option>
                    <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome + ' — ' + c.telefone}"></option>
                </select>
            </div>
            <div id="itens">
                <div class="row g-2 mb-2 item-row">
                    <div class="col-8">
                        <select class="form-select" name="itens[0].produtoId" required>
                            <option value="" disabled selected>Produto</option>
                            <option th:each="p : ${produtos}" th:value="${p.id}" th:text="${p.nome + ' — R$ ' + p.preco}"></option>
                        </select>
                    </div>
                    <div class="col-4"><input type="number" class="form-control" name="itens[0].quantidade" min="1" value="1" required/></div>
                </div>
            </div>
            <button type="button" class="btn btn-outline-secondary btn-sm mb-3" onclick="addItem()">+ Adicionar item</button>
            <div><button type="submit" class="btn btn-primary">Criar pedido</button></div>
        </form>
    </div></div>
    <script>
        let idx = 1;
        function addItem() {
            const base = document.querySelector('.item-row').cloneNode(true);
            base.querySelectorAll('select,input').forEach(el => {
                el.name = el.name.replace(/itens\[\d+\]/, 'itens[' + idx + ']');
                if (el.tagName === 'INPUT') el.value = 1;
                else el.selectedIndex = 0;
            });
            document.getElementById('itens').appendChild(base);
            idx++;
        }
    </script>
</div>
</body>
</html>
